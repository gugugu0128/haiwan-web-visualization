<!DOCTYPE html>
<html lang="en">
<head>
    <head>
        <meta charset="utf-8">
        <title>Three.js 最小测试</title>
        <style> #testCanvas { width: 500px; height: 500px; } </style>
    </head>
<body>
<div id="testCanvas"></div>
<!-- 加载 Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script>
    if (!WEBGL.isWebGLAvailable()) {
        const warning = WEBGL.getWebGLErrorMessage();
        document.getElementById('container').appendChild(warning);
    }
    // 1. 检查 WebGL 支持
    if (!THREE.WebGLRenderer.isWebGLAvailable()) {
        const warning = THREE.WebGLRenderer.getWebGLErrorMessage();
        document.getElementById('testCanvas').appendChild(warning);
        throw new Error("WebGL not supported");
    }

    // 2. 初始化场景、相机、渲染器
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
    camera.position.z = 5;
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(500, 500);
    document.getElementById('testCanvas').appendChild(renderer.domElement);

    // 3. 创建立方体
    const cube = new THREE.Mesh(
        new THREE.BoxGeometry(),
        new THREE.MeshBasicMaterial({ color: 0xff0000 }) // 红色
    );
    scene.add(cube);

    // 4. 渲染
    renderer.render(scene, camera);
    console.log("渲染完成，请检查页面");
</script>
</body>
</html>
